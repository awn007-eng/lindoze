[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lindoze"
version = "0.2.6"
description = "Linux system monitor with Windows 11 Task Manager layout"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Aaron", email = "awn007@gmail.com" }]
keywords = ["system-monitor", "task-manager", "linux", "kde", "qt", "psutil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
    "setproctitle>=1.3",
]

[project.urls]
Homepage = "https://github.com/awn007-eng/lindoze"
Repository = "https://github.com/awn007-eng/lindoze"
"Bug Tracker" = "https://github.com/awn007-eng/lindoze/issues"

[project.gui-scripts]
lindoze = "lindoze.__main__:main"

[tool.setuptools.packages.find]
include = ["lindoze*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Lean ruleset: pyflakes (real bugs + unused) only. The codebase uses the
# `x = Foo(); x.setBar(...)` compact-widget-construction style heavily, which
# would trip default pycodestyle E702 — keeping ruff to F-only avoids fighting
# the intentional style.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
