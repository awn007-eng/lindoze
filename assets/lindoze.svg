<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lindoze icon: stylized 4-bar histogram on a dark rounded square,
       bars colored to match the in-app accents (CPU teal, Mem violet,
       GPU orange, Disk green). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="48" ry="48" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="46" ry="46" fill="none"
        stroke="#333" stroke-width="2"/>

  <!-- Faint grid (subtle, like the graphs in-app) -->
  <g stroke="#2a2a2a" stroke-width="1">
    <line x1="40" y1="80"  x2="216" y2="80"/>
    <line x1="40" y1="128" x2="216" y2="128"/>
    <line x1="40" y1="176" x2="216" y2="176"/>
  </g>

  <!-- Baseline -->
  <line x1="36" y1="208" x2="220" y2="208" stroke="#444" stroke-width="2"/>

  <!-- Bars (heights chosen to feel "live"-ish, not flat) -->
  <!-- CPU bar (teal) -->
  <rect x="50"  y="92"  width="30" height="116" rx="3" fill="#17a2b8"/>
  <!-- Memory bar (violet) -->
  <rect x="92"  y="120" width="30" height="88"  rx="3" fill="#a67bd1"/>
  <!-- GPU bar (orange) -->
  <rect x="134" y="64"  width="30" height="144" rx="3" fill="#d17b59"/>
  <!-- Disk bar (green) -->
  <rect x="176" y="148" width="30" height="60"  rx="3" fill="#4caf50"/>
</svg>
