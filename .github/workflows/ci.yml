name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test deps
        # The current test suite only exercises gpu_backends, which has no Qt
        # imports — so we skip PySide6 to keep CI fast. Add it here when tests
        # start touching the GUI layer.
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil pytest
      - name: Run pytest
        run: python -m pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check lindoze tests
